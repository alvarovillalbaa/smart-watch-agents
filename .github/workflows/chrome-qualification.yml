name: Temporary Watch Agents Chrome qualification
on:
  workflow_dispatch:
    inputs:
      cases:
        type: string
        required: false
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
      - name: Owned actual installed-extension checks
        env:
          WATCH_AGENTS_MODE: chrome
          WATCH_AGENTS_CASES: ${{ inputs.cases }}
          WATCH_AGENTS_OUTPUT: ${{ runner.temp }}/watch-agents-chrome
        run: python3 tests/scripts/qualify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: watch-agents-chrome-${{ github.run_id }}
          path: ${{ runner.temp }}/watch-agents-chrome
          if-no-files-found: error
          retention-days: 7
